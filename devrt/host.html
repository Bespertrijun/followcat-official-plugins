<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FollowCat Plugin DevRT</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:13px;color:#1a1a1a;background:#0f1115;height:100vh;overflow:hidden;display:grid;grid-template-rows:48px 1fr 220px;color:#e6e8eb}
  header{background:#161922;border-bottom:1px solid #232733;display:flex;align-items:center;padding:0 16px;gap:14px}
  header .title{font-weight:600;font-size:14px;color:#e6e8eb}
  header .pill{font-size:11px;padding:3px 8px;border-radius:10px;background:#232733;color:#aab2c0}
  header .pill.ok{background:#0f3a1f;color:#7ee08c}
  header .pill.bad{background:#3b1117;color:#ff8b95}
  header .grow{flex:1}
  header button{background:#2a3142;border:1px solid #3a4357;color:#dde2ec;padding:5px 10px;border-radius:5px;font-size:12px;cursor:pointer}
  header button:hover{background:#36405a}

  main{display:grid;grid-template-columns:340px 1fr;min-height:0}
  .sidebar{border-right:1px solid #232733;background:#13161e;overflow:auto}
  .sidebar section{padding:12px 14px;border-bottom:1px solid #1f2330}
  .sidebar h3{font-size:11px;text-transform:uppercase;letter-spacing:0.6px;color:#8a93a6;margin-bottom:8px;font-weight:600}
  .sidebar .row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
  .sidebar .row input,.sidebar textarea,.sidebar select{flex:1;background:#0f1218;border:1px solid #2c3344;color:#e6e8eb;padding:5px 8px;border-radius:4px;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .sidebar textarea{width:100%;min-height:80px;resize:vertical;display:block}
  .sidebar button{background:#3a4257;border:1px solid #4a546b;color:#dde2ec;padding:4px 10px;border-radius:4px;font-size:12px;cursor:pointer;white-space:nowrap}
  .sidebar button:hover{background:#475070}
  .sidebar button.primary{background:#3656d6;border-color:#3656d6;color:#fff}
  .sidebar button.primary:hover{background:#2945c0}
  .sidebar .hookbtn{display:flex;align-items:center;gap:6px;font-family:ui-monospace,monospace;font-size:11px}
  .sidebar .small{color:#7c8497;font-size:11px;margin-bottom:6px}
  .sidebar .config-pair{display:grid;grid-template-columns:120px 1fr auto;gap:6px;margin-bottom:6px;align-items:center}
  .sidebar .config-pair input{min-width:0;width:100%}
  .sidebar .secret-flag{font-size:10px;color:#ffd070;white-space:nowrap}

  .stage{position:relative;background:#0f1115;display:flex;align-items:flex-start;justify-content:center;padding:18px;overflow:auto}
  .frame-wrap{background:#1a1d27;border:1px solid #232733;border-radius:8px;width:min(720px,100%);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.4);flex:none}
  .frame-wrap .frame-bar{padding:6px 12px;font-size:11px;color:#8a93a6;border-bottom:1px solid #232733;display:flex;justify-content:space-between;align-items:center;gap:10px}
  /* 高度由 host.resize 决定（同生产 PluginIframeHost：初始 400，clamp 200–1500） */
  .frame-wrap iframe{flex:none;border:0;width:100%;height:400px;display:block;background:#fff}
  .no-ui{color:#8a93a6;text-align:center;padding:30px;font-size:13px}

  footer{background:#13161e;border-top:1px solid #232733;display:flex;flex-direction:column}
  .log-bar{padding:6px 14px;font-size:11px;color:#8a93a6;border-bottom:1px solid #1f2330;display:flex;justify-content:space-between;align-items:center}
  .log-bar button{background:transparent;border:1px solid #2c3344;color:#aab2c0;padding:2px 8px;border-radius:3px;font-size:11px;cursor:pointer}
  #logs{flex:1;overflow:auto;padding:6px 14px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;line-height:1.6}
  #logs .log{display:grid;grid-template-columns:64px 50px 1fr;gap:8px;padding:1px 0}
  #logs .log .ts{color:#5f6679}
  #logs .log .lv{font-weight:600}
  #logs .log .lv.info{color:#7ed3ff}
  #logs .log .lv.warn{color:#ffd070}
  #logs .log .lv.error{color:#ff8b95}
  #logs .log .msg{color:#dde2ec;white-space:pre-wrap;word-break:break-all}

  .toast{position:fixed;top:60px;right:16px;background:#1f2330;border:1px solid #2c3344;color:#e6e8eb;padding:8px 14px;border-radius:6px;font-size:12px;box-shadow:0 4px 12px rgba(0,0,0,.4);z-index:10}
  .toast.success{border-color:#2d5a3a}
  .toast.error{border-color:#5a2d34}
  .toast.warning{border-color:#5a4d2d}
</style>
</head>
<body>

<header>
  <span class="title">🐱 FollowCat Plugin DevRT</span>
  <span class="pill" id="plugin-name">…</span>
  <span class="pill" id="plugin-version">v—</span>
  <span class="pill" id="http-mode">—</span>
  <span class="pill" id="status">loading</span>
  <span class="grow"></span>
  <button onclick="reloadFrame()">Reload UI</button>
</header>

<main>
  <aside class="sidebar">

    <section>
      <h3>Hooks</h3>
      <div class="small" id="hooks-summary">—</div>
      <div id="hooks-list"></div>
      <details style="margin-top:8px">
        <summary style="cursor:pointer;font-size:11px;color:#8a93a6">编辑 payload</summary>
        <select id="hook-select" style="margin-top:6px"></select>
        <textarea id="hook-payload" style="margin-top:6px;font-size:11px"></textarea>
        <button class="primary" style="margin-top:6px;width:100%" onclick="triggerCustom()">触发选中 hook</button>
      </details>
    </section>

    <section>
      <h3>Plugin APIs</h3>
      <div class="small" id="apis-summary">—</div>
      <div id="apis-list"></div>
    </section>

    <section>
      <h3>Config (mock)</h3>
      <div class="small">对应管理页的插件配置（此处明文显示；标 secret 的项经 iframe 桥回读为 ""，插件后端 config.get 仍拿明文）</div>
      <div id="config-list"></div>
      <div class="config-pair">
        <input type="text" id="cfg-new-key" placeholder="key">
        <input type="text" id="cfg-new-value" placeholder="value">
        <button onclick="addConfig()">+</button>
      </div>
      <label class="small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="cfg-new-secret"> 新增项标记为 secret</label>
      <button class="primary" style="margin-top:6px;width:100%" onclick="saveConfig()">保存配置</button>
    </section>

  </aside>

  <div class="stage">
    <div class="frame-wrap" id="frame-wrap">
      <div class="frame-bar">
        <span>plugin UI / iframe sandbox="allow-scripts"</span>
        <span id="frame-height">400px</span>
        <span id="frame-url">…</span>
      </div>
      <iframe id="plugin-iframe" sandbox="allow-scripts" referrerpolicy="no-referrer" src="about:blank"></iframe>
    </div>
  </div>
</main>

<footer>
  <div class="log-bar">
    <span>Logs (live)</span>
    <span><button onclick="clearLogs()">clear</button></span>
  </div>
  <div id="logs"></div>
</footer>

<script>
'use strict';

var state = null;
var serverConfig = null;   // 服务端最近一次下发的 config（算「改过的键」用）

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }

function toast(level, msg) {
  var t = document.createElement('div');
  t.className = 'toast ' + (level || 'info');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, 2500);
}

// ─── load state, render sidebars ───

async function loadState() {
  var res = await fetch('/api/state');
  state = await res.json();
  $('plugin-name').textContent = state.plugin_id || '(unknown)';
  $('plugin-version').textContent = 'v' + (state.manifest && state.manifest.version || '—');
  $('http-mode').textContent = state.allow_http ? 'http: real' : 'http: mock';
  if (state.load_error) {
    $('status').className = 'pill bad';
    $('status').textContent = 'load error';
    toast('error', 'Plugin load error: ' + state.load_error);
  } else {
    $('status').className = 'pill ok';
    $('status').textContent = 'ready';
  }
  serverConfig = Object.assign({}, state.config || {});
  renderHooks();
  renderApis();
  renderConfig();
  initFrame();
}

function renderHooks() {
  var listed = state.hooks_registered || [];
  $('hooks-summary').textContent = listed.length ? listed.length + ' registered' : '插件未注册任何 hook';
  var html = listed.map(function (h) {
    return '<div class="row"><button class="hookbtn" onclick="triggerHook(' + esc(JSON.stringify(h)) + ')">▶ ' + esc(h) + '</button></div>';
  }).join('');
  $('hooks-list').innerHTML = html;

  var select = $('hook-select');
  select.innerHTML = '<option value="">—</option>' + listed.map(function (h) {
    return '<option value="' + esc(h) + '">' + esc(h) + '</option>';
  }).join('');
  select.onchange = function () {
    var key = select.value;
    var sample = (state.hook_samples || {})[key] || {};
    $('hook-payload').value = JSON.stringify(sample, null, 2);
  };
}

function renderApis() {
  var listed = state.apis_registered || [];
  $('apis-summary').textContent = listed.length ? listed.length + ' registered' : '插件未注册自定义 API';
  $('apis-list').innerHTML = listed.map(function (p) {
    return '<div class="row"><button onclick="callApi(' + esc(JSON.stringify(p)) + ')">GET ' + esc(p) + '</button></div>';
  }).join('');
}

function renderConfig() {
  var cfg = state.config || {};
  var secrets = state.config_secrets || [];
  var keys = Object.keys(cfg).sort();
  $('config-list').innerHTML = keys.map(function (k) {
    var flag = secrets.indexOf(k) >= 0 ? '<span class="secret-flag" title="is_secret：iframe 桥回读为 &quot;&quot;">secret</span>' : '';
    return '<div class="config-pair">' +
      '<input type="text" value="' + esc(k) + '" data-cfg-key="' + esc(k) + '" disabled title="' + esc(k) + '">' +
      '<input type="text" value="' + esc(cfg[k]) + '" data-cfg-value="' + esc(k) + '">' +
      '<span style="display:flex;gap:4px;align-items:center">' + flag +
      '<button onclick="removeConfig(' + esc(JSON.stringify(k)) + ')">×</button></span>' +
      '</div>';
  }).join('');
}

// 从 server 重新拉 config（iframe 桥 config.put / 插件后端 config.set 之后刷新侧栏）
async function refreshConfig() {
  try {
    var res = await fetch('/api/state');
    var s = await res.json();
    state.config = s.config;
    state.config_secrets = s.config_secrets;
    serverConfig = Object.assign({}, s.config);
    renderConfig();
  } catch (e) { /* 侧栏刷新失败不影响桥 */ }
}

// ─── actions ───

async function triggerHook(hook) {
  var sample = (state.hook_samples || {})[hook] || {};
  await sendTrigger(hook, sample);
}

async function triggerCustom() {
  var hook = $('hook-select').value;
  if (!hook) { toast('warning', '先选择一个 hook'); return; }
  var raw = $('hook-payload').value;
  var data = {};
  if (raw.trim()) {
    try { data = JSON.parse(raw); }
    catch (e) { toast('error', 'payload 不是合法 JSON'); return; }
  }
  await sendTrigger(hook, data);
}

async function sendTrigger(hook, data) {
  try {
    var res = await fetch('/api/trigger', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({hook: hook, data: data})
    });
    if (!res.ok) {
      var t = await res.text(); toast('error', 'trigger 失败: ' + t); return;
    }
    var out = await res.json();
    if (hook === 'should_download' && out.verdict) {
      // 回显宿主会得出的裁决（只认显式 false；{have_bitmap} 合集逐集过滤；超时 / 抛错 fail-open 放行）
      var line = 'should_download → ' + out.verdict + (out.fail_open ? '（fail-open：' + (out.error || '') + '）' : '') +
        '，返回值 ' + JSON.stringify(out.result);
      toast(out.verdict === 'veto' ? 'warning' : 'success', line);
      pushLog({ts: Date.now()/1000, level: 'info', args: ['[devrt] ' + line]});
      return;
    }
    toast('success', 'fired ' + hook);
  } catch (e) {
    toast('error', String(e));
  }
}

async function callApi(p) {
  try {
    var res = await fetch('/api/call-api', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({path: p, req: {method: 'GET', body: '', query: {}}})
    });
    var data = await res.json();
    if (!res.ok) { toast('error', 'API ' + p + ' 失败: ' + (data.detail || res.status)); return; }
    toast('success', 'API ' + p + ' → ' + JSON.stringify(data.result).slice(0, 80));
    pushLog({ts: Date.now()/1000, level: 'info', args: ['[api ' + p + ']', JSON.stringify(data.result)]});
  } catch (e) { toast('error', String(e)); }
}

// 只提交改过的键（与服务端最近一次下发的值比）+ 新增项：没动的键不回写，
// 免得把插件后端这期间 config.set 的新值冲回旧值
async function saveConfig() {
  var entries = {};
  var server = serverConfig || {};
  document.querySelectorAll('input[data-cfg-value]').forEach(function (inp) {
    var k = inp.getAttribute('data-cfg-value');
    if (!(k in server) || server[k] !== inp.value) entries[k] = inp.value;
  });
  var n = Object.keys(entries).length;
  if (!n && !pendingSecrets.length) { toast('warning', '没有改动'); return; }
  try {
    var res = await fetch('/api/config', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({entries: entries, secrets: pendingSecrets})
    });
    if (!res.ok) { toast('error', '保存失败: ' + await res.text()); return; }
    toast('success', '已保存 ' + n + ' 项');
    pendingSecrets = [];
    await refreshConfig();
  } catch (e) { toast('error', String(e)); }
}

var pendingSecrets = [];

function addConfig() {
  var k = $('cfg-new-key').value.trim();
  var v = $('cfg-new-value').value;
  if (!k) return;
  state.config = state.config || {};
  state.config[k] = v;
  if ($('cfg-new-secret').checked) {
    pendingSecrets.push(k);
    state.config_secrets = (state.config_secrets || []).concat([k]);
  }
  $('cfg-new-key').value = ''; $('cfg-new-value').value = ''; $('cfg-new-secret').checked = false;
  renderConfig();
}

// 删除走显式接口（DELETE /api/config/<key>），立即生效
async function removeConfig(k) {
  if (serverConfig && !(k in serverConfig)) {
    // 还没保存过的新增项：只从侧栏去掉
    if (state.config) delete state.config[k];
    pendingSecrets = pendingSecrets.filter(function (x) { return x !== k; });
    renderConfig();
    return;
  }
  try {
    var res = await fetch('/api/config/' + encodeURIComponent(k), { method: 'DELETE' });
    if (!res.ok) { toast('error', '删除失败: ' + await res.text()); return; }
    toast('success', '已删除 ' + k);
    await refreshConfig();
  } catch (e) { toast('error', String(e)); }
}

// ─── plugin iframe + postMessage bridge ───
//
// 逐项复刻生产宿主 FollowCat frontend/src/components/PluginIframeHost.vue（及其调用的
// api/plugins.ts sandboxApiCall / sandboxGetConfig / sandboxPutConfig、utils/pluginBridge.ts）。
// 改生产宿主时同步这里；/plugin-sdk.js 是主仓 internal/api/sdk/plugin-sdk.js 的逐字节拷贝。
// 差异只在传输层：生产走 /api/plugins/<id>/sandbox/*（pluginToken 鉴权），这里走本地
// server.py 的 /api/sandbox/*（同形统一信封，无鉴权）。

var PLUGIN_SLOT = 'plugin.settings';   // manifest ui.slots 目前只支持这一个
var SANDBOX_TIMEOUT_MS = 15000;        // 生产 sandboxRequest = axios.create({ timeout: 15000 })
var iframeHeight = 400;                // 生产 iframeHeight 初值

function setIframeHeight(h) {
  iframeHeight = h;
  var iframe = $('plugin-iframe');
  if (iframe) iframe.style.height = h + 'px';
  $('frame-height').textContent = h + 'px';
}

function initFrame() {
  if (!state.ui_available) {
    $('frame-wrap').innerHTML = '<div class="no-ui">该插件没有 ui/ 目录，无前端 UI。</div>';
    return;
  }
  var iframe = $('plugin-iframe');
  setIframeHeight(400);
  // 同生产：manifest.entry 形如 "ui/index.html"，剥掉前导 "/" 与 "ui/"；src 带 ?fcSlot=<slot>
  var entry = (state.manifest && state.manifest.ui && state.manifest.ui.entry) || 'ui/index.html';
  var file = entry.replace(/^\/+/, '').replace(/^ui\//i, '');
  var src = '/plugin-ui/' + file + '?fcSlot=' + encodeURIComponent(PLUGIN_SLOT);
  iframe.src = src;
  $('frame-url').textContent = src;
}

function reloadFrame() { initFrame(); }

// 复刻 sandboxRequest（axios 实例）+ 其响应拦截器：
//   - 非 2xx → 形如 AxiosError：message "Request failed with status code N"，带 response.{status,data}
//   - 2xx 但信封 code != 0 → Error(message || 'Error')
//   - 否则解封返回 data
async function sandboxRequest(method, url, body, jsonBody) {
  var ctrl = new AbortController();
  var timer = setTimeout(function () { ctrl.abort(); }, SANDBOX_TIMEOUT_MS);
  var init = { method: method, signal: ctrl.signal, headers: {} };
  if (body !== null && body !== undefined) {
    init.body = body;
    if (jsonBody) init.headers['Content-Type'] = 'application/json';
  }
  var res;
  try {
    res = await fetch(url, init);
  } catch (e) {
    if (ctrl.signal.aborted) throw new Error('timeout of ' + SANDBOX_TIMEOUT_MS + 'ms exceeded');
    throw new Error('Network Error');
  } finally {
    clearTimeout(timer);
  }
  var text = await res.text();
  var data;
  try { data = JSON.parse(text); } catch (e) { data = text; }
  if (res.status < 200 || res.status >= 300) {
    var err = new Error('Request failed with status code ' + res.status);
    err.response = { status: res.status, data: data };
    throw err;
  }
  if (data && typeof data.code !== 'undefined' && data.code !== 0) {
    throw new Error(data.message || 'Error');
  }
  return data && data.data !== undefined ? data.data : data;
}

// 复刻 axios 默认 transformRequest + XHR send(requestData || null) 对 body 的处理：
// 普通对象/数组 → JSON.stringify（Content-Type: application/json）；Blob/ArrayBuffer 原样、
// TypedArray 取 .buffer；其余原值，且假值（null / '' / 0 / false / NaN）不发请求体（req.body 为 ""）。
function axiosRequestBody(data) {
  if (data instanceof Blob || data instanceof ArrayBuffer) return { body: data, json: false };
  if (ArrayBuffer.isView(data)) return { body: data.buffer, json: false };
  if (data !== null && typeof data === 'object') return { body: JSON.stringify(data), json: true };
  if (!data) return { body: null, json: false };
  return { body: typeof data === 'string' ? data : String(data), json: false };
}

// 复刻 sandboxApiCall：body 为 undefined → GET 且不带请求体；否则 POST。
// path 原样拼进 URL（含 ?query），由服务端按 buildPluginAPIRequest 拆 req.query。
function sandboxApiCall(action, body) {
  var url = '/api/sandbox/api' + (action.startsWith('/') ? action : '/' + action);
  if (body === undefined) return sandboxRequest('GET', url, null, false);
  var b = axiosRequestBody(body);
  return sandboxRequest('POST', url, b.body, b.json);
}

function sandboxGetConfig() {
  return sandboxRequest('GET', '/api/sandbox/config', null, false);
}

function sandboxPutConfig(entries) {
  return sandboxRequest('PUT', '/api/sandbox/config', JSON.stringify({ entries: entries }), true);
}

// 复刻 sandboxDeleteConfig：DELETE .../sandbox/config/<key>，回 {deleted}（是否真的删到一行）
function sandboxDeleteConfig(key) {
  return sandboxRequest('DELETE', '/api/sandbox/config/' + encodeURIComponent(key), null, false);
}

// 复刻 utils/pluginBridge.ts pluginConfigDeleteKey：格式规则（字符集、长度、保留名）交给后端，与 config.put
// 同一套；这里只拦到不了后端的两类输入——非字符串 / 空串（否则会去删一个叫 "undefined" 的键），
// 以及 "." / ".."（作为 URL 路径段会被浏览器规范化掉，打不到该键）
function pluginConfigDeleteKey(raw) {
  if (typeof raw !== 'string' || raw === '') {
    throw new Error('config.delete: key must be a non-empty string');
  }
  if (raw === '.' || raw === '..') {
    throw new Error('config.delete: key "' + raw + '" cannot be deleted through the iframe bridge');
  }
  return raw;
}

// 复刻 utils/pluginBridge.ts pluginBridgeErrorMessage：信封 message 优先，没有才退回 err.message
function pluginBridgeErrorMessage(err) {
  var envelopeMsg = err && err.response && err.response.data && err.response.data.message;
  if (typeof envelopeMsg === 'string' && envelopeMsg !== '') return envelopeMsg;
  return (err && err.message !== undefined && err.message !== null) ? err.message : String(err);
}

// 复刻 utils/pluginBridge.ts pluginConfigValue：设过 → 字符串（secret 脱敏为 ""），没设过 → null
function pluginConfigValue(entries, key) {
  var entry = entries.find(function (e) { return e.key === key; });
  return entry ? (entry.value !== undefined && entry.value !== null ? entry.value : '') : null;
}

window.addEventListener('message', async function (e) {
  var iframeEl = $('plugin-iframe');
  // 同生产：按 source window 引用做身份校验（sandbox iframe 的 origin 是 'null'，不能靠 origin）
  if (!iframeEl || e.source !== iframeEl.contentWindow) return;
  var msg = e.data;
  if (!msg || typeof msg !== 'object' || !msg.id || !msg.type) return;

  function reply(data, errMsg) {
    if (iframeEl.contentWindow) {
      iframeEl.contentWindow.postMessage(
        errMsg
          ? { id: msg.id, error: { message: errMsg } }
          : { id: msg.id, result: data },
        '*'
      );
    }
  }

  try {
    switch (msg.type) {
      case 'fc.init':
        reply({ pluginId: state.plugin_id, slot: PLUGIN_SLOT });
        break;
      case 'api.call':
        reply(await sandboxApiCall(msg.payload.path, msg.payload.body));
        break;
      case 'config.get': {
        var all = await sandboxGetConfig();
        var key = msg.payload && msg.payload.key;
        if (key) {
          reply(pluginConfigValue(all, key));
        } else {
          reply(all);
        }
        break;
      }
      case 'config.put':
        reply(await sandboxPutConfig([{
          key: msg.payload.key,
          value: msg.payload.value,
          is_secret: msg.payload.is_secret,
        }]));
        refreshConfig();
        break;
      case 'config.delete':
        // 回 {deleted: bool}：是否真的删到一行（没设过的键 → false）
        reply(await sandboxDeleteConfig(pluginConfigDeleteKey(msg.payload && msg.payload.key)));
        refreshConfig();
        break;
      case 'host.notify': {
        var level = (msg.payload && msg.payload.level) === 'error' ? 'error' : 'success';
        var text = msg.payload && msg.payload.message;
        toast(level, text !== undefined && text !== null ? text : '');
        reply({ ok: true });
        break;
      }
      case 'host.resize': {
        var h = Math.max(200, Math.min(1500, Number(msg.payload && msg.payload.height) || 400));
        setIframeHeight(h);
        reply({ ok: true, applied: h });
        break;
      }
      default:
        reply(undefined, 'unknown message type: ' + msg.type);
    }
  } catch (err) {
    reply(undefined, pluginBridgeErrorMessage(err));
  }
});

// ─── log stream ───

function pushLog(entry) {
  var el = $('logs');
  var div = document.createElement('div');
  div.className = 'log';
  var ts = new Date(entry.ts * 1000).toTimeString().slice(0,8);
  div.innerHTML = '<span class="ts">' + ts + '</span><span class="lv ' + esc(entry.level) + '">' + esc(entry.level) + '</span><span class="msg"></span>';
  div.querySelector('.msg').textContent = (entry.args || []).join(' ');
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

function clearLogs() { $('logs').innerHTML = ''; }

// 断线重连前先关掉旧连接：EventSource 自己也会重连，不关的话每次 onerror 都多挂一条流，日志重复显示
var logStream = null;
var logReconnectTimer = null;
function startLogStream() {
  if (logStream) { logStream.close(); logStream = null; }
  var es = new EventSource('/api/logs/stream');
  logStream = es;
  es.onmessage = function (ev) {
    if (!ev.data) return;
    try { pushLog(JSON.parse(ev.data)); } catch (e) {}
  };
  es.onerror = function () {
    if (es !== logStream) return;
    es.close();
    logStream = null;
    if (logReconnectTimer) return;
    logReconnectTimer = setTimeout(function () { logReconnectTimer = null; startLogStream(); }, 2000);
  };
}

// ─── boot ───

loadState().then(startLogStream);
</script>
