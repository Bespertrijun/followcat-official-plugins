name: Build & Deploy plugin registry

# 只从 tag 发布：followcat 之前同时从 main 和 tag 部署 Pages，GitHub 把默认分支(main)
# 的部署当「主部署」服务、tag 部署只记录不生效，导致打完 tag 线上不翻、必须补一次 main
# 构建。改成 tag-only（对齐 drivecat-official-plugins）后，tag 部署即唯一主部署，一步发布。
on:
  push:
    tags: ["*/v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 插件 / devrt 的 node 测试与 build.py 的 unittest：任一不过就不构建、不发布。
  # 按具体文件路径跑（node --test 的目录参数在不同 Node 版本上行为不一）。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Node tests (plugins + devrt)
        run: |
          set -e
          for f in devrt/cookie-normalize.test.js \
                   tests/cookiecloud/cookiecloud.test.js \
                   tests/cookiecloud/ui-state.test.js \
                   tests/media-library-filter/media-library-filter.test.js \
                   tests/devrt/sandbox.test.js; do
            echo "::group::node --test $f"
            node --test "$f"
            echo "::endgroup::"
          done

      - name: build.py unittest
        run: python3 -m unittest tests/build/test_build.py

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # build.py 需要按 tag 抽历史版本
          fetch-depth: 0

      # 关键：强制拉全 tag，保证 build.py 一定看得到刚推的新 tag（否则可能按旧 tag 发布）
      - name: Fetch all tags
        run: git fetch --tags --force --prune

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 校验 manifest 与 index.json 一致性（permissions / hooks / source_url 必须匹配、一个插件只能一条 entry，blocking）。
      # 「HEAD 与最新 tag 同版本号但内容不同」只对本次 tag 对应的插件判失败，其它插件只警告——
      # 它们这次不发布，main 上别的插件的半成品不该拦住这次发版。手动触发（不是 tag 构建）时全部只警告。
      - name: Validate manifest ↔ index.json consistency
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python scripts/build.py --check --release-tag "$RELEASE_TAG"

      - name: Build artifacts
        env:
          # GitHub Pages 部署后的 zip URL 前缀，FollowCat 会按此地址直接下载
          BASE_URL: ${{ format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          # 可选 Ed25519 签名（M2 前瞻）；未配置 secret 时自动跳过签名
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: python scripts/build.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: build-and-deploy
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags --force --prune

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild for release attachment
        env:
          BASE_URL: ${{ format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: python scripts/build.py

      # tag 形如 media-library-filter/v0.1.0 → plugin=media-library-filter, version=0.1.0
      - name: Resolve plugin/version from tag
        id: parse
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PLUGIN="${TAG%/v*}"
          VERSION="${TAG##*/v}"
          echo "tag=$TAG"          >> "$GITHUB_OUTPUT"
          echo "plugin=$PLUGIN"    >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.parse.outputs.tag }}
          name: ${{ steps.parse.outputs.plugin }} v${{ steps.parse.outputs.version }}
          body: |
            自动构建发布。zip 与签名见 attachments；
            FollowCat 服务端会按 GitHub Pages 上的 `index.json` 拉取最新版本。
          files: |
            dist/packages/${{ steps.parse.outputs.plugin }}/${{ steps.parse.outputs.version }}/plugin.zip
            dist/packages/${{ steps.parse.outputs.plugin }}/${{ steps.parse.outputs.version }}/plugin.sig
          fail_on_unmatched_files: false
