name: Build & Deploy plugin registry

on:
  push:
    branches: [main]
    tags: ["*/v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build.py 需要按 tag 抽历史版本
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # PR 与 push 都跑：校验 manifest 与 index.json 一致性
      - name: Validate manifest ↔ index.json consistency
        run: python scripts/build.py --check

      - name: Build artifacts
        env:
          # GitHub Pages 部署后的 zip URL 前缀，FollowCat 会按此地址直接下载
          BASE_URL: ${{ format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          # 可选 Ed25519 签名（M2 前瞻）；未配置 secret 时自动跳过签名
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: python scripts/build.py

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild for release attachment
        env:
          BASE_URL: ${{ format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: python scripts/build.py

      # tag 形如 media-library-filter/v0.1.0 → plugin=media-library-filter, version=0.1.0
      - name: Resolve plugin/version from tag
        id: parse
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PLUGIN="${TAG%/v*}"
          VERSION="${TAG##*/v}"
          echo "tag=$TAG"          >> "$GITHUB_OUTPUT"
          echo "plugin=$PLUGIN"    >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.parse.outputs.tag }}
          name: ${{ steps.parse.outputs.plugin }} v${{ steps.parse.outputs.version }}
          body: |
            自动构建发布。zip 与签名见 attachments；
            FollowCat 服务端会按 GitHub Pages 上的 `index.json` 拉取最新版本。
          files: |
            dist/packages/${{ steps.parse.outputs.plugin }}/${{ steps.parse.outputs.version }}/plugin.zip
            dist/packages/${{ steps.parse.outputs.plugin }}/${{ steps.parse.outputs.version }}/plugin.sig
          fail_on_unmatched_files: false
